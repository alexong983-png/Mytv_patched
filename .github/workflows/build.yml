name: Build patched APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 --pattern "Mytv_2*.apk" --output Mytv_2_4_1.apk
          ls -l Mytv_2_4_1.apk
      - run: bash build.sh
      - name: Publish patched APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1 Mytv_patched.apk --clobber
