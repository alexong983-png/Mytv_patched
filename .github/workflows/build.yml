name: Build patched APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 --pattern "*.apk" --output Mytv_2_4_1.apk
          ls -l Mytv_2_4_1.apk
          unzip -tq Mytv_2_4_1.apk | tail -1
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mytv_patched
          path: Mytv_patched.apk
